# Copy this file to config.yaml and fill in your values.
# config.yaml is gitignored - it may contain your API key.

# Folder the pipeline watches for incoming note PDFs.
# Export PDFs from your e-ink device (Boox, reMarkable, Supernote, Kindle Scribe, etc.)
# and drop them here. Or point this at a cloud-synced folder (Google Drive, Dropbox, etc.)
# for automatic transfer.
inbox: ~/eink-inbox

# Your Obsidian vault. Notes land in <notes_folder> inside it.
vault: /path/to/your/Obsidian/Vault
notes_folder: Handwritten Notes

# OCR backend: gemini | mistral | local | openrouter
# All backends use vision/OCR-capable models. See README for guidance.
backend: gemini

gemini:
  # Get a free key at https://aistudio.google.com -> Get API key.
  # You can also set the GEMINI_API_KEY environment variable instead.
  api_key: ""
  model: gemini-3.5-flash
  # Free tier limits: keep these conservative; the daily counter enforces them.
  requests_per_minute: 10
  requests_per_day: 250

mistral:
  # Optional paid fallback. Set MISTRAL_API_KEY env var or fill in here.
  api_key: ""
  model: mistral-ocr-latest

local:
  # Fully local OCR via Ollama. No API key, no cloud, works offline.
  # Install Ollama (https://ollama.com), then pull a vision-capable model:
  #   ollama pull qwen3-vl
  # Any vision/OCR model that works with Ollama's /api/generate endpoint will work.
  # Models improve over time - check https://ollama.com/search?q=vision for current options.
  host: http://127.0.0.1:11434
  model: qwen3-vl

openrouter:
  # OpenRouter gives access to many vision models through one API.
  # Get a key at https://openrouter.ai/keys.
  # You can also set the OPENROUTER_API_KEY environment variable instead.
  # Browse vision models at https://openrouter.ai/models?q=vision.
  # Nemotron Nano 12B 2 VL (free) scores well on OCRBench v2 but requires
  # enabling prompt logging at https://openrouter.ai/settings/privacy.
  # Qwen3 VL 32B Instruct is a strong alternative that works without changes.
  # Other options: openai/gpt-4o-mini, nvidia/nemotron-nano-12b-v2-vl:free
  api_key: ""
  model: qwen/qwen3-vl-32b-instruct
  base_url: https://openrouter.ai/api/v1
