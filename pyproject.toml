[project]
name = "eink-to-obsidian"
version = "0.1.0"
description = "Pipeline: e-ink handwritten note PDFs -> vision OCR -> Obsidian markdown"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "watchdog>=4.0",
    "pyyaml>=6.0",
    "google-genai>=1.0",
    "requests>=2.31",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
eink-to-obsidian = "eink_to_obsidian.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eink_to_obsidian"]
